name: Java CI

on:

  push:
  schedule:
    - cron:  '0 5 */1 * *'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        distribution: [ 'temurin', 'graalvm']
        java: [ 21, 25, 27]
        experimental: [ false ]
        exclude:
          - distribution: graalvm
            java: 27
        include:
          - java: 28-ea
            os: ubuntu-latest
            experimental: true
            distribution: temurin
          - java: 28-ea
            os: macos-latest
            experimental: true
            distribution: temurin
          - java: 28-ea
            os: windows-latest
            experimental: true
            distribution: temurin
    name: Build with Java ${{ matrix.distribution }}/${{ matrix.java }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: "${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}"
          restore-keys: ${{ runner.os }}-m2
      - name: Build with Maven
        run: mvn -B -C -Dgroups='!unstableGithub' verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ matrix.distribution != 'graalvm' || matrix.java != 27 }}
      - name: Sonar
        run: mvn -B -C org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        if: ${{ matrix.java == 21 && matrix.os  == 'ubuntu-latest' && github.actor != 'dependabot[bot]' && matrix.distribution != 'graalvm'  }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Graal-native
        run: mvn -B -C -Pnative -Dgroups='!unstableGithub' verify
        if: ${{ matrix.distribution == 'graalvm' && matrix.java != 27 }}
